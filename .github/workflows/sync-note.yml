# noteの新着をHP（ブログ一覧・トップのニュース）に自動で反映する
name: sync-note

on:
  schedule:
    - cron: '0 */3 * * *'   # 3時間ごと
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_note.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "note-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/notes.json blog.html index.html
          git commit -m "noteの新着を反映"
          git push
